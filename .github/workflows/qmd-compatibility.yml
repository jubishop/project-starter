name: QMD compatibility

on:
  pull_request:
    paths:
      - 'starter/**'
      - 'bin/smoke-qmd'
      - 'tools/qmd/**'
      - '.github/workflows/qmd-compatibility.yml'
  push:
    branches: [main]
    paths:
      - 'starter/**'
      - 'bin/smoke-qmd'
      - 'tools/qmd/**'
      - '.github/workflows/qmd-compatibility.yml'
  schedule:
    - cron: '23 16 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qmd-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-qmd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          check-latest: true
      - name: Install the latest QMD and backend in isolation
        run: |
          mkdir -p "$RUNNER_TEMP/qmd-runtime"
          cp tools/qmd/package.json "$RUNNER_TEMP/qmd-runtime/"
          npm --prefix "$RUNNER_TEMP/qmd-runtime" install --no-audit --no-fund
          npm --prefix "$RUNNER_TEMP/qmd-runtime" ls @tobilu/qmd node-llama-cpp
      - name: Download models before timing indexing and search
        timeout-minutes: 10
        env:
          QMD_CONFIG_DIR: ${{ runner.temp }}/qmd-model-config
        run: |
          mkdir -p "$QMD_CONFIG_DIR" .cache/validation
          "$RUNNER_TEMP/qmd-runtime/node_modules/.bin/qmd" pull --progress 2>&1 | tee .cache/validation/model-download.log
      - name: Verify actual indexing, search, models, and worktrees
        run: env -u CI bin/smoke-qmd --qmd "$RUNNER_TEMP/qmd-runtime/node_modules/.bin/qmd" --download-models --strict-diagnostics --command-timeout 600 --cpu-only
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qmd-latest
          path: .cache/validation/
          retention-days: 14
          include-hidden-files: true

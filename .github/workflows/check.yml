name: Starter checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: starter-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install ShellCheck on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Install ShellCheck on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Install actionlint
        env:
          GOBIN: ${{ runner.temp }}/project-starter-bin
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Record tool versions
        run: |
          python3 --version
          git --version
          shellcheck --version
          actionlint -version
      - name: Check guide, starter, and GitHub integration
        run: bin/check
